wireplumber#sink:
  node-type: Audio/Sink

  format: "{icon} {volume}"
  format-muted: " {volume}"
  format-bluetooth: "{bll}"
  format-bluetooth-muted: "ew"
  format-icons: [, ]

  smooth-scrolling-threshold: 0.2

  on-click: ~/.config/usrscripts/volume.sh sink mute
  on-click-middle: helvum
  on-click-right: footclient -a wiremix wiremix

  on-scroll-up: ~/.config/usrscripts/volume.sh sink raise
  on-scroll-down: ~/.config/usrscripts/volume.sh sink lower

  tooltip: true
  tooltip-format: "{node_name}"

mpris:
  player: playerctld
  # interval: 30

  format: |-
    {player}  {status_icon}
  format-playing: |-
    {player_icon}  {status_icon}
  format-paused: |-
    {player_icon}  {status_icon}
  format-stopped: |-
    {status_icon}

  dynamic-order: [title, artist, album]

  player-icons:
    chromium: 
    mpv: 
  
  status-icons:
    playing: 
    paused: 
    stopped: 󰌳
  
  tooltip: true
  tooltip-format: |-
    {dynamic}


wireplumber#source:
  node-type: Audio/Source

  format: " {volume}"
  format-muted: " {volume}"

  smooth-scrolling-threshold: 0.2
  on-click: ~/.config/usrscripts/volume.sh source mute
  on-click-middle: helvum
  on-click-right: footclient -a wiremix wiremix

  on-scroll-up: ~/.config/usrscripts/volume.sh source raise
  on-scroll-down: ~/.config/usrscripts/volume.sh source lower

  tooltip: true
  tooltip-format: "{node_name}"