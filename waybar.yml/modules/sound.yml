wireplumber#source:
  node-type: Audio/Source

  format: " {volume}"
  format-muted: " {volume}"

  scroll-step: 0.5
  on-click: wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
  on-click-middle: helvum
  on-click-right: footclient -a wiremix wiremix

  tooltip: true
  tooltip-format: "{node_name}"